<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitchen Accountability ERP — ISKCON Ponda</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- React 18 & Babel Standalone for Native In-Browser Execution on Render -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>
  </head>
  <body>
    <!-- React Root Mount Point -->
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; color: var(--text-muted); font-family: 'Plus Jakarta Sans', sans-serif;">
        <div class="spinner-modern" style="width: 42px; height: 42px;"></div>
        <div style="font-weight: 600; font-size: 0.95rem;">Initializing Kitchen Accountability ERP...</div>
      </div>
    </div>

    <!-- Application Utilities & API Client -->
    <script src="/static/js/constants.js"></script>
    <script src="/static/js/api.js"></script>

    <!-- Modular React Components -->
    <script type="text/babel" src="/static/js/components/Toast.jsx"></script>
    <script type="text/babel" src="/static/js/components/Common.jsx"></script>
    <script type="text/babel" src="/static/js/components/Header.jsx"></script>
    <script type="text/babel" src="/static/js/components/Navigation.jsx"></script>
    <script type="text/babel" src="/static/js/components/SyncBanner.jsx"></script>
    <script type="text/babel" src="/static/js/components/Orders/StatsCards.jsx"></script>
    <script type="text/babel" src="/static/js/components/Orders/OrdersToolbar.jsx"></script>
    <script type="text/babel" src="/static/js/components/Orders/OrdersTable.jsx"></script>
    <script type="text/babel" src="/static/js/components/Orders/OrdersMobileCards.jsx"></script>
    <script type="text/babel" src="/static/js/components/Orders/Pagination.jsx"></script>
    <script type="text/babel" src="/static/js/components/Vendors/VendorSection.jsx"></script>
    <script type="text/babel" src="/static/js/components/Cooks/CookSection.jsx"></script>
    <script type="text/babel" src="/static/js/components/Analytics/AnalyticsSection.jsx"></script>
    <script type="text/babel" src="/static/js/components/Policy/PolicySection.jsx"></script>
    <script type="text/babel" src="/static/js/components/Modals.jsx"></script>
    <script type="text/babel" src="/static/js/App.jsx"></script>
    <script type="text/babel" src="/static/js/index.jsx"></script>
  </body>
</html>
