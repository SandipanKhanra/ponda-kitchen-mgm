<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitchen Accountability ERP — ISKCON Ponda</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();

      // Diagnostic listener to catch and report startup exceptions
      window.addEventListener('error', function(e) {
        console.error('[KitchenERP Startup Error]', e);
        const root = document.getElementById('root');
        if (root && root.querySelector('.spinner-modern')) {
          root.innerHTML = '<div style="max-width: 650px; margin: 4rem auto; padding: 2rem; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 12px; color: #9f1239; font-family: Plus Jakarta Sans, sans-serif; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);">' +
            '<h3 style="margin: 0 0 0.5rem; font-size: 1.25rem;">Dashboard Initialization Error</h3>' +
            '<p style="font-size: 0.9rem; color: #4c0519; margin-bottom: 1rem;">An unexpected error occurred while loading the dashboard components:</p>' +
            '<pre style="background: #ffe4e6; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.82rem; overflow-x: auto; color: #881337;">' + (e.message || 'Unknown initialization error') + '</pre>' +
            '<div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">' +
              '<button onclick="location.reload()" style="padding: 0.6rem 1.2rem; background: #e11d48; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Reload Page</button>' +
              '<button onclick="localStorage.clear(); location.reload();" style="padding: 0.6rem 1.2rem; background: #f43f5e; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Reset Cache & Reload</button>' +
            '</div>' +
          '</div>';
        }
      });
    </script>

    <!-- React 18 & Babel Standalone for Native In-Browser Execution on Render -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>
  </head>
  <body>
    <!-- React Root Mount Point -->
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; color: var(--text-muted); font-family: 'Plus Jakarta Sans', sans-serif;">
        <div class="spinner-modern" style="width: 42px; height: 42px;"></div>
        <div style="font-weight: 600; font-size: 0.95rem;">Initializing Kitchen Accountability ERP...</div>
      </div>
    </div>

    <!-- Application Utilities & API Client -->
    <script src="/static/js/constants.js"></script>
    <script src="/static/js/api.js"></script>

    <!-- Consolidated React Application (Zero Race Conditions, High Performance) -->
    <script type="text/babel" src="/static/js/app-bundle.jsx"></script>
  </body>
</html>
